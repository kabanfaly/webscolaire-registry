# Java Maven CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: circleci/openjdk:11-jdk
      - image: circleci/mongo:4.2

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/postgres:9.4

    working_directory: ~/webscolaire-registry

    environment:
      # Customize the JVM maximum heap limit
      MAVEN_OPTS: -Xmx3200m

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}
          
      # package into a jar
      - run: mvn clean package
      - store_artifacts:
          path: target/classes
          destination: webscolaire-registry
      - setup_remote_docker
      - run:
          name: Install Docker Compose
          command: |
            set -x
            curl -L https://github.com/docker/compose/releases/download/1.11.2/docker-compose-`uname -s`-`uname -m` > ~/webscolaire-registry/docker-compose
            sudo mv ~/webscolaire-registry/docker-compose /usr/local/bin/
            sudo chmod +x /usr/local/bin/docker-compose
      - run:
          name: Start container and verify it's working
          command: |
            set -x
            docker-compose up -d
      - deploy:
          name: Build and push Docker image
          command: |
            #TAG="0.1.${CIRCLE_BUILD_NUM}"
            docker build -t knfaly/ws-registry:latest .
            docker login -u $DOCKER_LOGIN -p $DOCKER_PASSWORD
            docker push knfaly/ws-registry:latest

      
