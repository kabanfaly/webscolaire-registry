version: '3.1'

services:
  ws-registry:
    image: ws-registry
    restart: always
    ports:
      - 8181:8181
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - MONGO_URI=mongodb://mongo:27017/webscolaire_registry
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mongo
      
  mongo:
    image: mongo:4.4.2
    container_name: mongo
    ports:
      - 27017:27017
    volumes:
      - ~/storage/docker/mongo:/data/db
    restart: always