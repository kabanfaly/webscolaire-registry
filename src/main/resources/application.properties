spring.data.mongodb.auto-index-creation=false
spring.application.name=webscolaire-registry
server.port=8181
management.server.port=9090

# Authentication
# Authentication
webscolaire.registry.username=admin
webscolaire.registry.password=kaba
webscolaire.registry.timeZone=UTC

# Database
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=webscolaire_registry

management.endpoints.web.exposure.include=*

info.app.name=WebScolaire Registry
info.app.description=A registry for WebScolaire application
info.app.version='@project.version@'
