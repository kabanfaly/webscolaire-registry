info:
  app:
    name: WebScolaire Registry
    description: A registry for WebScolaire application
    version: '@project.version@'
logging:
  level:
    ROOT: INFO
    com.webscolaire.registry: INFO
spring:
  data:
    mongodb:
      auto-index-creation: false
      uri: ${MONGO_URI:mongodb://localhost:27017/webscolaire_registry}
      database: webscolaire_registry
  application:
    name: webscolaire-registry
server:
  port: 8181
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: "*"

# Authentication
webscolaire:
  registry:
    username: ${REGISTRY_USERNAME}
    password: ${REGISTRY_PASSWORD}
    timeZone: ${REGITRY_TIMEZONE:UTC}

---
spring:
  config:
    activate:
      on-profile: dev
REGISTRY_USERNAME: admin
REGISTRY_PASSWORD: kaba

logging:
  level:
    ROOT: INFO
    com.webscolaire.registry: DEBUG