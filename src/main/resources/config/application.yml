info:
  app:
    name: WebScolaire Registry
    description: A registry for WebScolaire application
    version: '@project.version@'
logging:
  level:
    ROOT: INFO
    com.webscolaire.registry: INFO
spring:
  data:
    mongodb:
      auto-index-creation: false
      uri: ${MONGO_URI:mongodb://localhost:27017/webscolaire_registry}
      database: webscolaire_registry
  application:
    name: webscolaire-registry
  profiles:
    active: '@spring.profiles.active@' # Value from pom.xml
    
server:
  port: 8181
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: "*"

# Authentication
webscolaire:
  registry:
    username: ${REGISTRY_USERNAME:admin}
    password: ${REGISTRY_PASSWORD:kaba}
    timeZone: ${REGITRY_TIMEZONE:UTC}

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    ROOT: INFO
    com.webscolaire.registry: DEBUG