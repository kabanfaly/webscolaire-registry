version: '3.1'

services:
  ws-registry:
    build: .
    restart: always
    container_name: ws-registry
    ports:
      - 8181:8181
    expose:
      - "8181"
    working_dir: /opt/app
    environment:
      - JAVA_OPTS=
         -Dspring.data.mongodb.uri=mongodb://localhost:27017/webscolaire_registry
         -Dspring.profiles.active=dev
    depends_on:
      - mongo
      
  mongo:
    image: mongo
    #container_name: ws-mongo
    ports:
      - 27017:27017
    volumes:
      - $HOME/data/mongo:/data/db
    restart: always
